#user www-data;
worker_processes auto;
events {
  worker_connections 1024;
  # multi_accept on;
}
http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # server_tokens off;
    # server_names_hash_bucket_size 64;
    # server_name_in_redirect off;
    #include /etc/nginx/mime.types;
    default_type application/octet-stream;
    ##
    # SSL Settings
    ##
    #ssl_protocols TLSv1.2 ; # Dropping SSLv3, ref: POODLE
    #ssl_prefer_server_ciphers on;
    ##
    # Logging Settings
    ##
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    ##
    # Gzip Settings
    ##
    gzip on;
    gzip_disable "msie6";
    ##
    # Virtual Host Configs
    ##
    #include /etc/nginx/conf.d/*.conf;
    #include /etc/nginx/sites-enabled/*;
    # Redirect http requests to https
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name ozflux.org.au;
        return 301 https://$server_name$request_uri;
    }
    server {
        # see https://www.nginx.com/resources/wiki/start/topics/tutorials/config_pitfalls/
        # to see why we hardwire the IP address
        listen 443 http2 ssl;
        listen [::]:443 http2 ssl;
        server_name ozflux.org.au;

        ssl_protocols  TLSv1.2;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
        add_header Strict-Transport-Security "max-age=63072000; includeSubdomains";
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        ssl_certificate /etc/nginx/certs/cert.crt;
        ssl_certificate_key /etc/nginx/certs/key.key;

        root /var/lib/tomcat/webapps/ROOT;

        location / {
            proxy_pass http://ozflux-web:8080;
            proxy_redirect http://ozflux-web:8080 $scheme://localhost;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_connect_timeout 1500;
            proxy_send_timeout 1000;
            proxy_read_timeout 1000;
            proxy_buffers 4 32k;
            client_max_body_size 0;
            client_body_buffer_size 128k;
        }
        large_client_header_buffers 8 80k;
        access_log /var/log/nginx/ozflux.access_ssl.log;
        error_log /var/log/nginx/ozflux.error_ssl.log info;
    }
}
